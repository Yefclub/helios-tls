[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
# E4/E7/E9 (pycodestyle), F (pyflakes), I (isort), B (bugbear), UP (pyupgrade)
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["core", "app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
